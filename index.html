<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generator Prompt Poster Pondok DHA</title>
    <style>
        :root {
            --primary: #1f5f3a;
            --primary-hover: #16472b;
            --bg: #f4ecd8;
            --surface: #ffffff;
            --text: #333333;
            --border: #cccccc;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background-color: var(--surface);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h1 {
            color: var(--primary);
            text-align: center;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--primary);
            padding-bottom: 10px;
        }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        @media (max-width: 600px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }
        .form-group {
            display: flex;
            flex-direction: column;
        }
        .form-group.full-width {
            grid-column: 1 / -1;
        }
        label {
            font-weight: 600;
            margin-bottom: 5px;
            color: var(--primary);
            font-size: 0.9em;
        }
        input[type="text"], textarea {
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
        }
        input[type="text"]:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(31, 95, 58, 0.2);
        }
        textarea {
            resize: vertical;
            min-height: 80px;
        }
        .buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        button {
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
            flex: 1;
        }
        .btn-generate {
            background-color: var(--primary);
            color: white;
        }
        .btn-generate:hover {
            background-color: var(--primary-hover);
        }
        .btn-copy {
            background-color: #e0e0e0;
            color: #333;
        }
        .btn-copy:hover {
            background-color: #d0d0d0;
        }
        .output-container {
            margin-top: 30px;
        }
        #output-text {
            width: 100%;
            height: 300px;
            background-color: #f8f9fa;
            border: 1px solid var(--border);
            padding: 15px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 13px;
            white-space: pre-wrap;
            box-sizing: border-box;
        }
        .toast {
            visibility: hidden;
            min-width: 250px;
            background-color: var(--primary);
            color: #fff;
            text-align: center;
            border-radius: 6px;
            padding: 16px;
            position: fixed;
            z-index: 1;
            left: 50%;
            bottom: 30px;
            transform: translateX(-50%);
            font-size: 15px;
        }
        .toast.show {
            visibility: visible;
            animation: fadein 0.5s, fadeout 0.5s 2.5s;
        }
        @keyframes fadein {
            from {bottom: 0; opacity: 0;}
            to {bottom: 30px; opacity: 1;}
        }
        @keyframes fadeout {
            from {bottom: 30px; opacity: 1;}
            to {bottom: 0; opacity: 0;}
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Generator Prompt Poster</h1>
    
    <div class="grid">
        <div class="form-group">
            <label for="JUDUL_UTAMA">Judul Utama</label>
            <input type="text" id="JUDUL_UTAMA" value="TANDA SESEORANG LEMAH AKALNYA">
        </div>
        
        <div class="form-group">
            <label for="SUMBER_PENULIS">Sumber Penulis</label>
            <input type="text" id="SUMBER_PENULIS" value="Ibnu Abdil Barr rahimahullah berkata">
        </div>

        <div class="form-group full-width">
            <label for="ISI_KUTIPAN">Isi Kutipan</label>
            <textarea id="ISI_KUTIPAN">Kekaguman seseorang kepada dirinya sendiri itu tanda kelemahan akalnya</textarea>
        </div>

        <div class="form-group full-width">
            <label for="SUMBER_KITAB">Sumber Kitab</label>
            <input type="text" id="SUMBER_KITAB" value="Jami’ bayanil Ilmi wa fadhli 1/143">
        </div>

        <div class="form-group">
            <label for="HARI">Hari</label>
            <input type="text" id="HARI" value="SABTU">
        </div>

        <div class="form-group">
            <label for="TANGGAL_HIJRI">Tanggal Hijriyah</label>
            <input type="text" id="TANGGAL_HIJRI" value="14 Dzulqa’dah 1447 H">
        </div>

        <div class="form-group">
            <label for="TANGGAL_MASEHI">Tanggal Masehi</label>
            <input type="text" id="TANGGAL_MASEHI" value="02 Mei 2026 M">
        </div>

        <div class="form-group full-width">
            <label for="AJAKAN_SEDEKAH">Ajakan Sedekah</label>
            <textarea id="AJAKAN_SEDEKAH">Sedekah tidak mesti dengan Uang, Sampah Rongsokpun bila diniatkan ikhlas bisa jadi ladang Amal. Tim Rongsok siap menjemput ketempat Njenengan, Mari bersedekah Rongsok untuk membantu keuangan Pondok DHA, lingkungan bersih Pahala didapat</textarea>
        </div>

        <div class="form-group full-width">
            <label for="NAMA_PROGRAM">Nama Program</label>
            <input type="text" id="NAMA_PROGRAM" value="RONGSOK BERKAH BERNILAI JARIYAH PONDOK DHA">
        </div>

        <div class="form-group">
            <label for="NAMA_KONTAK">Nama Kontak</label>
            <input type="text" id="NAMA_KONTAK" value="Babe Hasan">
        </div>

        <div class="form-group">
            <label for="NO_HP">No. HP</label>
            <input type="text" id="NO_HP" value="0852 1891 4533">
        </div>
    </div>

    <div class="buttons">
        <button class="btn-generate" onclick="generatePrompt()">Hasilkan Prompt</button>
        <button class="btn-copy" onclick="copyToClipboard()">Salin ke Clipboard</button>
    </div>

    <div class="output-container">
        <label for="output-text">Hasil Prompt (Siap Disalin):</label>
        <textarea id="output-text" readonly></textarea>
    </div>
</div>

<div id="toast" class="toast">Prompt berhasil disalin!</div>

<script>
    const template = `Create a highly detailed Islamic poster design, vertical 9:16 aspect ratio, ultra realistic yet slightly stylized illustration.

BACKGROUND (DO NOT CHANGE):
A warm, serene tropical courtyard scene in golden morning sunlight. Large leafy trees frame the top left and right, with sunlight rays filtering through leaves (god rays). Soft bokeh light particles floating in the air. On the bottom: a traditional Indonesian Islamic building (pesantren style), white pillars, classic architecture, brown tiled roof, surrounded by lush greenery and flowers. Atmosphere peaceful, spiritual, calm. Lighting cinematic, warm tone, golden hour.
Use the uploaded image as reference. Maintain strong resemblance.

Foreground uses layered clean UI-style panels with soft rounded corners and subtle shadows.

COLOR STYLE:
Dominant colors: deep green, cream/beige, warm gold sunlight
Accent: dark forest green (#1f5f3a), soft cream (#f4ecd8)
Soft gradients, elegant Islamic aesthetic

TYPOGRAPHY LAYOUT (VERY IMPORTANT):

[HEADER TITLE - PLACEHOLDER_1]
Text: "{{JUDUL_UTAMA}}"
Style:
- Bold rounded sans-serif (similar to Poppins ExtraBold / Baloo / Nunito ExtraBold)
- Color: deep green with subtle white outline
- Slight 3D emboss effect
- All caps
- Large size (~10-12% of canvas height)
- Center aligned
- Add small decorative leaf ornaments on left & right

[SUBTITLE LABEL]
Text: "{{SUMBER_PENULIS}}"
Example: Ibnu Abdil Barr rahimahullah berkata
Style:
- Smaller pill-shaped label
- Background: dark green
- Text: white
- Font: medium sans-serif (Poppins Medium)
- Centered

[QUOTE BOX - PLACEHOLDER_2]
Text: "{{ISI_KUTIPAN}}"
Style:
- Inside rounded rectangle box
- Background: soft cream
- Border: thin green stroke
- Font: clean sans-serif (Poppins / Open Sans)
- Weight: Medium to SemiBold
- Size: medium-large (~5-6% canvas height)
- Line spacing slightly wide
- Center aligned
- Add quotation marks

[REFERENCE LABEL]
Text: "{{SUMBER_KITAB}}"
Example: Jami’ bayanil Ilmi wa fadhli 1/143
Style:
- Small pill label under quote
- Background: dark green
- Text: white
- Include small book icon

[DAY SECTION - PLACEHOLDER_3]
Text: "{{HARI}}"
Example: SABTU
Style:
- VERY LARGE bold text (~8-10% height)
- Dark green color
- With mosque icon on left inside circular badge

[DATE SECTION - PLACEHOLDER_4 & 5]
Text:
"{{TANGGAL_HIJRI}}   |   {{TANGGAL_MASEHI}}"
Style:
- Smaller than day
- Icons: calendar icons before each date
- Clean sans-serif regular
- Color: dark green

[CALL TO ACTION TEXT]
Text: "{{AJAKAN_SEDEKAH}}"
Style:
- Small paragraph
- Center aligned
- Dark green text
- Regular weight

[MAIN CTA BUTTON]
Text: "{{NAMA_PROGRAM}}"
Example: RONGSOK BERKAH BERNILAI JARIYAH PONDOK DHA
Style:
- Rounded capsule button
- Dark green background
- White bold text
- Medium-large size

[CONTACT SECTION - PLACEHOLDER_6]
Text: "{{NAMA_KONTAK}} {{NO_HP}}"
Style:
- Rounded pill
- Light background with green border
- Include user icon on left

VISUAL STYLE:
- Clean hierarchy
- Soft drop shadows on panels
- Consistent spacing
- Islamic minimal modern design
- High readability
- Balanced composition (top text, middle quote, bottom building)

QUALITY:
Ultra high resolution, 4K, sharp details, professional poster design, cinematic lighting, soft glow, depth of field

IMPORTANT:
Keep layout identical, only text changes
Do not change background composition
Maintain exact visual structure

--ar 9:16`;

    function generatePrompt() {
        let output = template;
        
        // Mengambil semua nilai dari input
        const keys = [
            'JUDUL_UTAMA', 'SUMBER_PENULIS', 'ISI_KUTIPAN', 'SUMBER_KITAB',
            'HARI', 'TANGGAL_HIJRI', 'TANGGAL_MASEHI', 'AJAKAN_SEDEKAH',
            'NAMA_PROGRAM', 'NAMA_KONTAK', 'NO_HP'
        ];

        // Mengganti placeholder dengan nilai input
        keys.forEach(key => {
            const value = document.getElementById(key).value;
            // Gunakan regex global untuk memastikan semua instance terganti jika ada lebih dari satu
            const regex = new RegExp(`{{${key}}}`, 'g');
            output = output.replace(regex, value);
        });

        // Menampilkan hasilnya
        document.getElementById('output-text').value = output;
    }

    function copyToClipboard() {
        const outputText = document.getElementById('output-text');
        
        if (!outputText.value) {
            generatePrompt(); // Hasilkan otomatis jika masih kosong
        }
        
        outputText.select();
        outputText.setSelectionRange(0, 99999); // Untuk perangkat mobile
        
        navigator.clipboard.writeText(outputText.value).then(() => {
            showToast();
        }).catch(err => {
            console.error('Gagal menyalin teks: ', err);
        });
    }

    function showToast() {
        const toast = document.getElementById("toast");
        toast.className = "toast show";
        setTimeout(function(){ toast.className = toast.className.replace("toast show", "toast"); }, 3000);
    }

    // Eksekusi pertama kali saat halaman dimuat
    window.onload = generatePrompt;
</script>

</body>
</html>
