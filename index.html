<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generator Prompt Gambar</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h2 {
            color: #1f5f3a;
            margin-bottom: 20px;
        }
        .container {
            display: flex;
            width: 100%;
            max-width: 1200px;
            gap: 20px;
        }
        .form-section, .result-section {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            flex: 1;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            color: #2c3e50;
            font-size: 14px;
        }
        input[type="text"], textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }
        textarea {
            resize: vertical;
            height: 80px;
        }
        .result-box {
            width: 100%;
            height: calc(100% - 60px);
            padding: 15px;
            background: #2b2b2b;
            color: #f8f8f2;
            border: none;
            border-radius: 4px;
            font-family: monospace;
            font-size: 13px;
            line-height: 1.5;
            resize: none;
        }
        .btn-copy {
            background-color: #1f5f3a;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
            margin-bottom: 10px;
            width: 100%;
            font-weight: bold;
            transition: background 0.3s;
        }
        .btn-copy:hover {
            background-color: #144026;
        }
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

    <h2>Generator Prompt Poster</h2>

    <div class="container">
        <!-- Bagian Form Input -->
        <div class="form-section">
            <div class="form-group">
                <label>Judul Utama:</label>
                <input type="text" id="JUDUL_UTAMA" value="TANDA SESEORANG LEMAH AKALNYA">
            </div>
            <div class="form-group">
                <label>Sumber Penulis:</label>
                <input type="text" id="SUMBER_PENULIS" value="Ibnu Abdil Barr rahimahullah berkata">
            </div>
            <div class="form-group">
                <label>Isi Kutipan:</label>
                <textarea id="ISI_KUTIPAN">Kekaguman seseorang kepada dirinya sendiri itu tanda kelemahan akalnya</textarea>
            </div>
            <div class="form-group">
                <label>Sumber Kitab:</label>
                <input type="text" id="SUMBER_KITAB" value="Jami’ bayanil Ilmi wa fadhli 1/143">
            </div>
            <div class="form-group">
                <label>Hari:</label>
                <input type="text" id="HARI" value="SABTU">
            </div>
            <div class="form-group">
                <label>Tanggal Hijriah:</label>
                <input type="text" id="TANGGAL_HIJRI" value="14 Dzulqa’dah 1447 H">
            </div>
            <div class="form-group">
                <label>Tanggal Masehi:</label>
                <input type="text" id="TANGGAL_MASEHI" value="02 Mei 2026 M">
            </div>
            <div class="form-group">
                <label>Ajakan Sedekah:</label>
                <textarea id="AJAKAN_SEDEKAH" style="height: 100px;">Sedekah tidak mesti dengan Uang, Sampah Rongsokpun bila diniatkan ikhlas bisa jadi ladang Amal. Tim Rongsok siap menjemput ketempat Njenengan, Mari bersedekah Rongsok untuk membantu keuangan Pondok DHA, lingkungan bersih Pahala didapat</textarea>
            </div>
            <div class="form-group">
                <label>Nama Program:</label>
                <input type="text" id="NAMA_PROGRAM" value="RONGSOK BERKAH BERNILAI JARIYAH PONDOK DHA">
            </div>
            <div class="form-group">
                <label>Nama Kontak:</label>
                <input type="text" id="NAMA_KONTAK" value="Babe Hasan">
            </div>
            <div class="form-group">
                <label>No HP:</label>
                <input type="text" id="NO_HP" value="0852 1891 4533">
            </div>
        </div>

        <!-- Bagian Hasil -->
        <div class="result-section">
            <button class="btn-copy" onclick="copyResult()">📋 Copy Hasil Prompt</button>
            <textarea id="resultOutput" class="result-box" readonly></textarea>
        </div>
    </div>

    <script>
        // Template dasar prompt
        const template = `Create a highly detailed Islamic poster design, vertical 9:16 aspect ratio, ultra realistic yet slightly stylized illustration.

BACKGROUND (DO NOT CHANGE):
A warm, serene tropical courtyard scene in golden morning sunlight. Large leafy trees frame the top left and right, with sunlight rays filtering through leaves (god rays). Soft bokeh light particles floating in the air. On the bottom: a traditional Indonesian Islamic building (pesantren style), white pillars, classic architecture, brown tiled roof, surrounded by lush greenery and flowers. Atmosphere peaceful, spiritual, calm. Lighting cinematic, warm tone, golden hour.
Use the uploaded image as reference. Maintain strong resemblance.

Foreground uses layered clean UI-style panels with soft rounded corners and subtle shadows.

COLOR STYLE:
Dominant colors: deep green, cream/beige, warm gold sunlight
Accent: dark forest green (#1f5f3a), soft cream (#f4ecd8)
Soft gradients, elegant Islamic aesthetic

TYPOGRAPHY LAYOUT (VERY IMPORTANT):

[HEADER TITLE - PLACEHOLDER_1]
Text: "{{JUDUL_UTAMA}}"
Style:
- Bold rounded sans-serif (similar to Poppins ExtraBold / Baloo / Nunito ExtraBold)
- Color: deep green with subtle white outline
- Slight 3D emboss effect
- All caps
- Large size (~10-12% of canvas height)
- Center aligned
- Add small decorative leaf ornaments on left & right

[SUBTITLE LABEL]
Text: "{{SUMBER_PENULIS}}"
Example: Ibnu Abdil Barr rahimahullah berkata
Style:
- Smaller pill-shaped label
- Background: dark green
- Text: white
- Font: medium sans-serif (Poppins Medium)
- Centered

[QUOTE BOX - PLACEHOLDER_2]
Text: "{{ISI_KUTIPAN}}"
Style:
- Inside rounded rectangle box
- Background: soft cream
- Border: thin green stroke
- Font: clean sans-serif (Poppins / Open Sans)
- Weight: Medium to SemiBold
- Size: medium-large (~5-6% canvas height)
- Line spacing slightly wide
- Center aligned
- Add quotation marks

[REFERENCE LABEL]
Text: "{{SUMBER_KITAB}}"
Example: Jami’ bayanil Ilmi wa fadhli 1/143
Style:
- Small pill label under quote
- Background: dark green
- Text: white
- Include small book icon

[DAY SECTION - PLACEHOLDER_3]
Text: "{{HARI}}"
Example: SABTU
Style:
- VERY LARGE bold text (~8-10% height)
- Dark green color
- With mosque icon on left inside circular badge

[DATE SECTION - PLACEHOLDER_4 & 5]
Text:
"{{TANGGAL_HIJRI}}   |   {{TANGGAL_MASEHI}}"
Style:
- Smaller than day
- Icons: calendar icons before each date
- Clean sans-serif regular
- Color: dark green

[CALL TO ACTION TEXT]
Text: "{{AJAKAN_SEDEKAH}}"
Style:
- Small paragraph
- Center aligned
- Dark green text
- Regular weight

[MAIN CTA BUTTON]
Text: "{{NAMA_PROGRAM}}"
Example: RONGSOK BERKAH BERNILAI JARIYAH PONDOK DHA
Style:
- Rounded capsule button
- Dark green background
- White bold text
- Medium-large size

[CONTACT SECTION - PLACEHOLDER_6]
Text: "{{NAMA_KONTAK}} {{NO_HP}}"
Style:
- Rounded pill
- Light background with green border
- Include user icon on left

VISUAL STYLE:
- Clean hierarchy
- Soft drop shadows on panels
- Consistent spacing
- Islamic minimal modern design
- High readability
- Balanced composition (top text, middle quote, bottom building)

QUALITY:
Ultra high resolution, 4K, sharp details, professional poster design, cinematic lighting, soft glow, depth of field

IMPORTANT:
Keep layout identical, only text changes
Do not change background composition
Maintain exact visual structure

--ar 9:16`;

        // Daftar ID input yang sesuai dengan variabel di template
        const inputsId = [
            "JUDUL_UTAMA", "SUMBER_PENULIS", "ISI_KUTIPAN", "SUMBER_KITAB",
            "HARI", "TANGGAL_HIJRI", "TANGGAL_MASEHI", "AJAKAN_SEDEKAH",
            "NAMA_PROGRAM", "NAMA_KONTAK", "NO_HP"
        ];

        // Fungsi untuk menggenerate hasil
        function generatePrompt() {
            let resultText = template;
            
            inputsId.forEach(id => {
                const value = document.getElementById(id).value;
                const regex = new RegExp(`{{${id}}}`, 'g');
                resultText = resultText.replace(regex, value);
            });

            document.getElementById('resultOutput').value = resultText;
        }

        // Fungsi untuk copy ke clipboard
        function copyResult() {
            const resultBox = document.getElementById('resultOutput');
            resultBox.select();
            resultBox.setSelectionRange(0, 99999); // Untuk mobile
            navigator.clipboard.writeText(resultBox.value).then(() => {
                const btn = document.querySelector('.btn-copy');
                const originalText = btn.innerText;
                btn.innerText = "✅ Tersalin!";
                btn.style.backgroundColor = "#27ae60";
                
                setTimeout(() => {
                    btn.innerText = originalText;
                    btn.style.backgroundColor = "#1f5f3a";
                }, 2000);
            });
        }

        // Tambahkan event listener agar hasil langsung berubah saat diketik
        inputsId.forEach(id => {
            document.getElementById(id).addEventListener('input', generatePrompt);
        });

        // Generate pertama kali saat halaman dimuat
        window.onload = generatePrompt;
    </script>
</body>
</html>
